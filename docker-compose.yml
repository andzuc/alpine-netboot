x-router_ip: &router_ip ${ROUTER_IP:-192.168.101.110}
x-dnsmasq_ip: &dnsmasq_ip ${DNSMASQ_IP:-192.168.101.110}
x-httpd_ip: &httpd_ip ${HTTPD_IP:-192.168.101.111}
x-ansible_ip: &ansible_ip ${ANSIBLE_IP:-192.168.101.112}
x-pxe_ip: &pxe_ip ${PXE_IP:-192.168.101.160}

networks:
  vnet:
    name: vnet
    driver: macvlan
    driver_opts:
      parent: ${INTERFACE:-intnet}
    ipam:
      config:
        - subnet: ${VNET:-192.168.101.0/24}

services:
  pxe-dnsmasq:
    build:
      context: dnsmasq
      args:
        - ALPINE_BASE_VERSION=3.20
    container_name: pxe-dnsmasq
    networks:
      default:
      vnet:
        ipv4_address: *dnsmasq_ip
    cap_add:
      - NET_ADMIN
    environment:
      ROUTER_IP: *router_ip
      SERVER_IP: *dnsmasq_ip
      HTTPD_IP: *httpd_ip
      ALPINE_VERSION:
      ALPINE_ARCH:
      PXE_MAC:
      PXE_IP: *pxe_ip
    volumes:
      - alpine-netboot:/pxe
  pxe-httpd:
    build:
      context: httpd
      args:
        - ALPINE_BASE_VERSION=3.20
    container_name: pxe-httpd
    networks:
      vnet:
        ipv4_address: *httpd_ip
    volumes:
      - alpine-netboot:/pxe:ro
  vm-serial-forwarder:
    image: alpine:3.20
    container_name: vm-serial-forwarder
    volumes:
      - /tmp/${VM_TITLE}:/tmp/${VM_TITLE}:rw
    entrypoint: >
      sh -c "
      apk add --no-cache socat &&
      echo 'Creazione socket e ascolto avviato...' &&
      mkdir -p /tmp/${VM_TITLE} &&
      sleep 10 &&
      socat -u UNIX-LISTEN:/tmp/${VM_TITLE}/serial0,mode=777,unlink-early=1 STDOUT"
    healthcheck:
      test: ["CMD-SHELL", "test -S /tmp/${VM_TITLE}/serial0"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s
  pxe-ansible:
    build:
      context: ansible
    container_name: pxe-ansible
    networks:
      vnet:
        ipv4_address: *ansible_ip

volumes:
  alpine-netboot:
