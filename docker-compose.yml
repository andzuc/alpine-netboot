networks:
  vnet:
    name: vnet
    driver: macvlan
    driver_opts:
      parent: ${INTERFACE:-intnet}
    ipam:
      config:
        - subnet: ${VNET:-192.168.102.0/24}
          gateway: ${ROUTER_IP:-192.168.102.1}

services:
  pxe-dnsmasq:
    build:
      context: dnsmasq
      args:
        - ALPINE_BASE_VERSION=3.20
    container_name: pxe-dnsmasq
    networks:
      vnet:
        ipv4_address: ${DNSMASQ_IP:-192.168.102.110}
    cap_add:
      - NET_ADMIN
    environment:
      - INTERFACE=${INTERFACE:-intnet}
      - SERVER_IP=${DNSMASQ_IP:-192.168.102.110}
      - HTTPD_IP=${HTTPD_IP:-192.168.102.111}
      - ROUTER_IP=${ROUTER_IP:-192.168.102.1}
      - ALPINE_VERSION
      - ARCH
      - PXE_MAC
      - PXE_IP=${PXE_IP:-192.168.102.160}
    volumes:
      - alpine-netboot:/pxe
  pxe-httpd:
    build:
      context: httpd
      args:
        - ALPINE_BASE_VERSION=3.20
    container_name: pxe-httpd
    networks:
      vnet:
        ipv4_address: ${HTTPD_IP:-192.168.102.111}
    volumes:
      - alpine-netboot:/pxe:ro
  pxe-ansible:
    build:
      context: ansible
    container_name: pxe-ansible
    networks:
      vnet:
        ipv4_address: ${ANSIBLE_IP:-192.168.102.112}

volumes:
  alpine-netboot:
