networks:
  vnet:
    name: vnet
    driver: macvlan
    driver_opts:
      parent: ${INTERFACE}
    ipam:
      config:
        - subnet: ${VNET}
          gateway: ${ROUTER_IP}

services:
  pxe-dnsmasq:
    build:
      context: dnsmasq
      args:
        ALPINE_BASE_VERSION: ${ALPINE_BASE_VERSION}
    container_name: pxe-dnsmasq
    restart: unless-stopped
    networks:
      vnet:
        ipv4_address: ${DNSMASQ_IP}
    cap_add:
      - NET_ADMIN
    environment:
      - INTERFACE
      - SERVER_IP=${DNSMASQ_IP}
      - ROUTER_IP
      - PXE_MAC
      - ALPINE_VERSION
      - ARCH
    volumes:
      - alpine-netboot:/pxe
  pxe-httpd:
    build:
      context: httpd
      args:
        ALPINE_BASE_VERSION: ${ALPINE_BASE_VERSION}
    container_name: pxe-httpd
    restart: unless-stopped
    networks:
      vnet:
        ipv4_address: ${HTTPD_IP}
    volumes:
      - alpine-netboot:/pxe:ro
  pxe-ansible:
    build:
      context: ansible
    container_name: pxe-ansible
    networks:
      vnet:
        ipv4_address: ${ANSIBLE_IP}

volumes:
  alpine-netboot:
