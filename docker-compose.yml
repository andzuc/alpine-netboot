x-router_ip: &router_ip ${ROUTER_IP:-192.168.101.254}
x-dnsmasq_ip: &dnsmasq_ip ${DNSMASQ_IP:-192.168.101.110}
x-httpd_ip: &httpd_ip ${HTTPD_IP:-192.168.101.111}
x-ansible_ip: &ansible_ip ${ANSIBLE_IP:-192.168.101.112}
x-pxe_ip: &pxe_ip ${PXE_IP:-192.168.101.160}
x-pxe_console: &pxe_console ${PXE_CONSOLE:-tty0}

networks:
  vnet:
    name: vnet
    driver: macvlan
    driver_opts:
      parent: ${INTERFACE:-intnet}
    ipam:
      config:
        - subnet: ${VNET:-192.168.101.0/24}

services:
  pxe-router:
    profiles:
      - virt
    build:
      context: router
      args:
        - ALPINE_BASE_VERSION=3.20
    container_name: pxe-router
    cap_add:
      - NET_ADMIN
    environment:
      ROUTER_IP: *router_ip
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      default:
      vnet:
        ipv4_address: *router_ip
  pxe-dnsmasq:
    build:
      context: dnsmasq
      args:
        - ALPINE_BASE_VERSION=3.20
    container_name: pxe-dnsmasq
    networks:
      default:
      vnet:
        ipv4_address: *dnsmasq_ip
    cap_add:
      - NET_ADMIN
    environment:
      ROUTER_IP: *router_ip
      SERVER_IP: *dnsmasq_ip
      HTTPD_IP: *httpd_ip
      ALPINE_VERSION:
      ALPINE_ARCH:
      PXE_MAC:
      PXE_IP: *pxe_ip
      PXE_CONSOLE: *pxe_console
    volumes:
      - alpine-netboot:/pxe
    healthcheck:
      test: ["CMD-SHELL", "pidof dnsmasq >/dev/null && test -f /pxe/undionly.kpxe && test -f /pxe/boot/vmlinuz-lts"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 120s
  pxe-httpd:
    build:
      context: httpd
      args:
        - ALPINE_BASE_VERSION=3.20
    container_name: pxe-httpd
    networks:
      vnet:
        ipv4_address: *httpd_ip
    volumes:
      - alpine-netboot:/pxe:ro
  pxe-vm-logger:
    profiles:
      - virt
    depends_on:
      pxe-dnsmasq:
        condition: service_healthy
      pxe-httpd:
        condition: service_started
      pxe-router:
        condition: service_started
    build:
      context: vm-logger
      args:
        - ALPINE_BASE_VERSION=3.20
    container_name: pxe-vm-logger
    environment:
      VM_TITLE: ${VM_TITLE}
    volumes:
      - /tmp/${VM_TITLE}:/tmp/${VM_TITLE}:rw
    healthcheck:
      test: ["CMD-SHELL", "test -S /tmp/${VM_TITLE}/serial0"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s
  pxe-ansible:
    build:
      context: ansible
    container_name: pxe-ansible
    networks:
      default:
      vnet:
        ipv4_address: *ansible_ip

volumes:
  alpine-netboot:
