---
- name: Genera coppia di chiavi SSH per Alpine PXE
  hosts: controller
  gather_facts: false

  tasks:
    - name: Crea directory keys
      ansible.builtin.file:
        path: "{{ key_dir }}"
        state: directory
        mode: "0700"

    - name: Genera chiave ed25519 (se non esiste)
      community.crypto.openssh_keypair:
        path: "{{ key_target_path }}"
        type: ed25519
        comment: "{{ key_target_comment }}"
        mode: "0600"
      register: keygen

    - name: Mostra fingerprint
      ansible.builtin.debug:
        msg: "Chiave generata: {{ keygen.fingerprint | default('già esistente') }}"

    - name: Copia chiave pubblica sul server PXE (HTTP root)
      ansible.builtin.copy:
        src: "{{ key_target_path }}.pub"
        dest: "{{ pxe_volume }}/{{ target_hostname }}.pub"
        mode: "0644"
      become: true
