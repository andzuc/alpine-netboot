---
ungrouped:
  hosts:
    controller:
      ansible_connection: local
    pxe_target:
      ansible_host: "{{ target_ip }}"
      ansible_user: root
      ansible_ssh_private_key_file: "{{ playbook_dir }}/../keys/alpine-pxe"
      ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
